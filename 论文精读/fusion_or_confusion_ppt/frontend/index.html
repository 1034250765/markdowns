    <!-- 全屏播放控制：F 键 / 双击页面 / 右下角按钮 -->
    <script>
        (function () {
            const btn = document.getElementById('fsBtn');
            const icon = document.getElementById('fsIcon');
            const EXPAND = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>';
            const SHRINK = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m8 0v-3a2 2 0 0 1 2-2h3"/>';

            function isFullscreen() {
                return !!(document.fullscreenElement || document.webkitFullscreenElement);
            }

            function toggleFullscreen() {
                if (!isFullscreen()) {
                    const el = document.documentElement;
                    const req = el.requestFullscreen || el.webkitRequestFullscreen;
                    if (req) Promise.resolve(req.call(el)).catch(function () {});
                } else {
                    const exit = document.exitFullscreen || document.webkitExitFullscreen;
                    if (exit) Promise.resolve(exit.call(document)).catch(function () {});
                }
            }

            function syncIcon() {
                if (icon) icon.innerHTML = isFullscreen() ? SHRINK : EXPAND;
                if (btn) btn.title = isFullscreen() ? '退出全屏（Esc）' : '全屏播放（F）';
                // 全屏切换后需要重新计算缩放
                window.setTimeout(function () {
                    window.dispatchEvent(new Event('resize'));
                }, 120);
            }

            if (btn) {
                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    toggleFullscreen();
                });
            }

            // 点击翻页：左侧 25% 区域上一页，其余区域下一页（双击不再绑定全屏，避免冲突）
            document.addEventListener('click', function (e) {
                if (e.target.closest && e.target.closest('button')) return;
                var x = e.clientX;
                if (x < window.innerWidth * 0.25) {
                    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
                } else {
                    document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
                }
            });

            document.addEventListener('keydown', function (e) {
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    toggleFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', syncIcon);
            document.addEventListener('webkitfullscreenchange', syncIcon);
        })();
    </script>
